aid: dependency-track

name: Dependency-Track

description: Dependency-Track is an OWASP flagship open source Component Analysis platform for Software Bill of Materials (SBOM) analysis. Per
  its site, over 20,000 organizations use it to inventory components, find vulnerabilities, and enforce policy across the software supply chain.
  It is self-hosted (distributed as Docker images) and exposes a REST API, documented with OpenAPI/Swagger, on each deployed instance at /api.

