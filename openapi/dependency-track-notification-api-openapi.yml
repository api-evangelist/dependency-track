openapi: 3.2.0
info:
  contact:
    name: The Dependency-Track Authors
    url: https://github.com/DependencyTrack/dependency-track
  description: 'REST API of OWASP Dependency-Track


    > **Note:** This API version is in maintenance mode and will be

    > superseded by v2, available under `/api/v2`, which follows a

    > spec-first approach.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: OWASP Dependency-Track Notification API
  version: 1.0.0
servers:
- url: /api
tags:
- name: Notification
paths:
  /v1/notification/publisher:
    get:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_READ
      operationId: getAllNotificationPublishers
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPublisherResponse'
          description: A list of all notification publishers
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns a list of all notification publishers
      tags:
      - Notification
    post:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_UPDATE
      operationId: updateNotificationPublisher
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationPublisherRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPublisherResponse'
          description: The updated notification publisher
        '400':
          description: Invalid notification class or trying to modify a default publisher
        '401':
          description: Unauthorized
        '404':
          description: The notification publisher could not be found
        '409':
          description: Conflict with an existing publisher's name
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Updates a notification publisher
      tags:
      - Notification
    put:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_CREATE
      operationId: createNotificationPublisher
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationPublisherRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPublisherResponse'
          description: The created notification publisher
        '400':
          description: Invalid notification class or trying to modify a default publisher
        '401':
          description: Unauthorized
        '409':
          description: Conflict with an existing publisher's name
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Creates a new notification publisher
      tags:
      - Notification
  /v1/notification/publisher/test/{uuid}:
    post:
      description: Requires permission SYSTEM_CONFIGURATION
      operationId: testNotificationRule
      parameters:
      - description: The UUID of the rule to test
        in: path
        name: uuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Test notification dispatched successfully
        '401':
          description: Unauthorized
        '404':
          description: Notification rule not found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Dispatches a rule notification test
      tags:
      - Notification
  /v1/notification/publisher/{notificationPublisherUuid}:
    delete:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_DELETE
      operationId: deleteNotificationPublisher
      parameters:
      - description: The UUID of the notification publisher to delete
        in: path
        name: notificationPublisherUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Notification publisher removed successfully
        '400':
          description: Deleting a default notification publisher is forbidden
        '401':
          description: Unauthorized
        '404':
          description: The UUID of the notification publisher could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Deletes a notification publisher and all related notification rules
      tags:
      - Notification
  /v1/notification/publisher/{uuid}/configSchema:
    get:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_READ
      operationId: getNotificationPublisherConfigSchema
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                additionalProperties: true
          description: Publisher config JSON schema
        '204':
          description: Publisher has no configuration
        '401':
          description: Unauthorized
        '404':
          description: The UUID of the notification publisher could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get notification publisher config schema
      tags:
      - Notification
  /v1/notification/rule:
    delete:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_DELETE
      operationId: deleteNotificationRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteNotificationRuleRequest'
      responses:
        '204':
          description: Notification rule removed successfully
        '401':
          description: Unauthorized
        '404':
          description: The UUID of the notification rule could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Deletes a notification rule
      tags:
      - Notification
    get:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_READ
      operationId: getAllNotificationRules
      parameters:
      - description: The page to return. To be used in conjunction with <code>pageSize</code>.
        in: query
        name: pageNumber
        schema:
          type: string
          default: '1'
      - description: Number of elements to return per page. To be used in conjunction with <code>pageNumber</code>.
        in: query
        name: pageSize
        schema:
          type: string
          default: '100'
      - description: Offset to start returning elements from. To be used in conjunction with <code>limit</code>.
        in: query
        name: offset
        schema:
          type: string
      - description: Number of elements to return per page. To be used in conjunction with <code>offset</code>.
        in: query
        name: limit
        schema:
          type: string
      - description: Name of the resource field to sort on.
        in: query
        name: sortName
        schema:
          type: string
      - description: Ordering of items when sorting with <code>sortName</code>.
        in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc, desc
      - description: The notification trigger type to filter on
        in: query
        name: triggerType
        schema:
          type: string
          enum:
          - EVENT
          - SCHEDULE
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationRule'
          description: A list of all notification rules
          headers:
            X-Total-Count:
              description: The total number of notification rules
              schema:
                format: integer
              style: simple
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns a list of all notification rules
      tags:
      - Notification
    post:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_UPDATE
      operationId: updateNotificationRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRuleRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The updated notification rule
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InvalidNotificationFilterExpressionProblemDetails'
          description: Invalid filter expression
        '401':
          description: Unauthorized
        '404':
          description: The UUID of the notification rule could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Updates a notification rule
      tags:
      - Notification
    put:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_CREATE
      operationId: createNotificationRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRuleRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The created notification rule
        '401':
          description: Unauthorized
        '404':
          description: The UUID of the notification publisher could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Creates a new notification rule
      tags:
      - Notification
  /v1/notification/rule/scheduled:
    put:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_CREATE
      operationId: createScheduledNotificationRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledNotificationRuleRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The created scheduled notification rule
        '401':
          description: Unauthorized
        '404':
          description: The UUID of the notification publisher could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Creates a new scheduled notification rule
      tags:
      - Notification
  /v1/notification/rule/{ruleUuid}/project/{projectUuid}:
    delete:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_DELETE
      operationId: removeProjectFromRule
      parameters:
      - description: The UUID of the rule to remove the project from
        in: path
        name: ruleUuid
        required: true
        schema:
          type: string
          format: uuid
      - description: The UUID of the project to remove from the rule
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The updated notification rule
        '304':
          description: The rule does not have the specified project assigned
        '401':
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Access to the requested project is forbidden
        '404':
          description: The notification rule or project could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Removes a project from a notification rule
      tags:
      - Notification
    post:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_UPDATE
      operationId: addProjectToRule
      parameters:
      - description: The UUID of the rule to add a project to
        in: path
        name: ruleUuid
        required: true
        schema:
          type: string
          format: uuid
      - description: The UUID of the project to add to the rule
        in: path
        name: projectUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The updated notification rule
        '304':
          description: The rule already has the specified project assigned
        '401':
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Access to the requested project is forbidden
        '404':
          description: The notification rule or project could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Adds a project to a notification rule
      tags:
      - Notification
  /v1/notification/rule/{ruleUuid}/team/{teamUuid}:
    delete:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_DELETE
      operationId: removeTeamFromRule
      parameters:
      - description: The UUID of the rule to remove the project from
        in: path
        name: ruleUuid
        required: true
        schema:
          type: string
          format: uuid
      - description: The UUID of the project to remove from the rule
        in: path
        name: teamUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The updated notification rule
        '304':
          description: The rule does not have the specified team assigned
        '401':
          description: Unauthorized
        '404':
          description: The notification rule or team could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Removes a team from a notification rule
      tags:
      - Notification
    post:
      description: Requires permission SYSTEM_CONFIGURATION or SYSTEM_CONFIGURATION_UPDATE
      operationId: addTeamToRule
      parameters:
      - description: The UUID of the rule to add a team to
        in: path
        name: ruleUuid
        required: true
        schema:
          type: string
          format: uuid
      - description: The UUID of the team to add to the rule
        in: path
        name: teamUuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRule'
          description: The updated notification rule
        '304':
          description: The rule already has the specified team assigned
        '401':
          description: Unauthorized
        '404':
          description: The notification rule or team could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Adds a team to a notification rule
      tags:
      - Notification
components:
  schemas:
    ProjectMetrics:
      type: object
      properties:
        components:
          type: integer
          format: int32
        critical:
          type: integer
          format: int32
        findingsAudited:
          type: integer
          format: int32
        findingsTotal:
          type: integer
          format: int32
        findingsUnaudited:
          type: integer
          format: int32
        firstOccurrence:
          type: integer
          format: int64
          description: UNIX epoch timestamp in milliseconds
        high:
          type: integer
          format: int32
        inheritedRiskScore:
          type: number
          format: double
        kev:
          type: integer
          format: int32
        lastOccurrence:
          type: integer
          format: int64
          description: UNIX epoch timestamp in milliseconds
        low:
          type: integer
          format: int32
        medium:
          type: integer
          format: int32
        policyViolationsAudited:
          type: integer
          format: int32
        policyViolationsFail:
          type: integer
          format: int32
        policyViolationsInfo:
          type: integer
          format: int32
        policyViolationsLicenseAudited:
          type: integer
          format: int32
        policyViolationsLicenseTotal:
          type: integer
          format: int32
        policyViolationsLicenseUnaudited:
          type: integer
          format: int32
        policyViolationsOperationalAudited:
          type: integer
          format: int32
        policyViolationsOperationalTotal:
          type: integer
          format: int32
        policyViolationsOperationalUnaudited:
          type: integer
          format: int32
        policyViolationsSecurityAudited:
          type: integer
          format: int32
        policyViolationsSecurityTotal:
          type: integer
          format: int32
        policyViolationsSecurityUnaudited:
          type: integer
          format: int32
        policyViolationsTotal:
          type: integer
          format: int32
        policyViolationsUnaudited:
          type: integer
          format: int32
        policyViolationsWarn:
          type: integer
          format: int32
        suppressed:
          type: integer
          format: int32
        unassigned:
          type: integer
          format: int32
        vulnerabilities:
          type: integer
          format: int32
        vulnerableComponents:
          type: integer
          format: int32
      required:
      - firstOccurrence
      - lastOccurrence
    Cwe:
      type: object
      properties:
        cweId:
          type: integer
          format: int32
        name:
          type: string
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
    CelExpressionError:
      type: object
      description: Errors identified during CEL expression compilation
      properties:
        column:
          type: integer
          format: int32
        line:
          type: integer
          format: int32
        message:
          type: string
    AffectedComponent:
      type: object
      properties:
        affectedVersionAttributions:
          type: array
          items:
            $ref: '#/components/schemas/AffectedVersionAttribution'
        identity:
          type: string
        identityType:
          type: string
          enum:
          - CPE
          - PURL
        uuid:
          type: string
          format: uuid
        version:
          type: string
        versionEndExcluding:
          type: string
        versionEndIncluding:
          type: string
        versionStartExcluding:
          type: string
        versionStartIncluding:
          type: string
        versionType:
          type: string
          enum:
          - EXACT
          - RANGE
    Component:
      type: object
      properties:
        author:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationalContact'
        blake2b_256:
          type: string
          pattern: ^[0-9a-f]{64}$
        blake2b_384:
          type: string
          pattern: ^[0-9a-f]{96}$
        blake2b_512:
          type: string
          pattern: ^[0-9a-f]{128}$
        blake3:
          type: string
          pattern: ^[A-Fa-f0-9]*$
        children:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        classifier:
          type: string
          enum:
          - APPLICATION
          - FRAMEWORK
          - LIBRARY
          - CONTAINER
          - OPERATING_SYSTEM
          - DEVICE
          - FIRMWARE
          - FILE
          - PLATFORM
          - DEVICE_DRIVER
          - MACHINE_LEARNING_MODEL
          - DATA
          - CRYPTOGRAPHIC_ASSET
        copyright:
          type: string
          maxLength: 1024
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        cpe:
          type: string
          maxLength: 255
          minLength: 0
          pattern: (cpe:2\.3:[aho\*\-](:(((\?*|\*?)([a-zA-Z0-9\-\._]|(\\[\\\*\?!"#$$%&'\(\)\+,/:;<=>@\[\]\^`\{\|}~]))+(\?*|\*?))|[\*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[\*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-\._]|(\\[\\\*\?!"#$$%&'\(\)\+,/:;<=>@\[\]\^`\{\|}~]))+(\?*|\*?))|[\*\-])){4})|([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9\._\-~%]*){0,6})
        dependencyGraph:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
        description:
          type: string
          maxLength: 1024
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        directDependencies:
          type: string
        expandDependencyGraph:
          type: boolean
        extension:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{Alnum}!@#$%^&{}\[\]()_+\-=,.~'` ]{1,255}$
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
        filename:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{Alnum}:/\\!@#$%^&{}\[\]()_+\-=,.~'` ]{1,255}$
        group:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        isInternal:
          type: boolean
        lastInheritedRiskScore:
          type: number
          format: double
        license:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        licenseExpression:
          type: string
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        licenseUrl:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^((((https?|ftps?|sftp|imap|rtsp|rtmp|sip|sips|git|ssh|telnet|nntp|file)://)|(mailto:|news:))(%[0-9A-Fa-f]{2}|[-()_.!~*';/?:@&=+$,A-Za-z0-9])+)([).!';/?:,][[:blank:]])?$
        md5:
          type: string
          pattern: ^[0-9a-fA-F]{32}$
        metrics:
          $ref: '#/components/schemas/DependencyMetrics'
        name:
          type: string
          maxLength: 255
          minLength: 1
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        notes:
          type: string
        occurrenceCount:
          type: integer
          format: int64
        parent:
          $ref: '#/components/schemas/Component'
        project:
          $ref: '#/components/schemas/Project'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ComponentProperty'
        publisher:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        purl:
          type: string
          maxLength: 1024
          minLength: 0
        purlCoordinates:
          type: string
          maxLength: 1024
          minLength: 0
          readOnly: true
        repositoryMeta:
          $ref: '#/components/schemas/RepositoryMetaComponent'
        resolvedLicense:
          $ref: '#/components/schemas/License'
        scope:
          type: string
          enum:
          - REQUIRED
          - OPTIONAL
          - EXCLUDED
          maxLength: 255
          minLength: 0
        sha1:
          type: string
          pattern: ^[0-9a-fA-F]{40}$
        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        sha384:
          type: string
          pattern: ^[0-9a-fA-F]{96}$
        sha3_256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        sha3_384:
          type: string
          pattern: ^[0-9a-fA-F]{96}$
        sha3_512:
          type: string
          pattern: ^[0-9a-fA-F]{128}$
        sha512:
          type: string
          pattern: ^[0-9a-fA-F]{128}$
        streebog_256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        streebog_512:
          type: string
          pattern: ^[0-9a-fA-F]{128}$
        supplier:
          $ref: '#/components/schemas/OrganizationalEntity'
        swidTagId:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        uuid:
          type: string
          format: uuid
        version:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/Vulnerability'
      required:
      - classifier
      - name
      - project
      - uuid
    ComponentProperty:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
          minLength: 0
          pattern: \P{Cc}+
        groupName:
          type: string
          maxLength: 255
          minLength: 1
          pattern: \P{Cc}+
        propertyName:
          type: string
          maxLength: 255
          minLength: 1
          pattern: \P{Cc}+
        propertyType:
          type: string
          enum:
          - BOOLEAN
          - INTEGER
          - NUMBER
          - STRING
          - TIMESTAMP
          - URL
          - UUID
        propertyValue:
          type: string
          maxLength: 1024
          minLength: 0
          pattern: \P{Cc}+
        uuid:
          type: string
          format: uuid
      required:
      - propertyName
      - propertyType
      - uuid
    UpdateNotificationPublisherRequest:
      type: object
      properties:
        description:
          type: string
        extensionName:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        template:
          type: string
        templateMimeType:
          type: string
        uuid:
          type: string
          format: uuid
      required:
      - extensionName
      - name
      - uuid
    OidcGroup:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          pattern: '[\P{Cc}]+'
        uuid:
          type: string
          format: uuid
      required:
      - name
      - uuid
    RepositoryMetaComponent:
      type: object
      properties:
        lastCheck:
          type: integer
          format: int64
