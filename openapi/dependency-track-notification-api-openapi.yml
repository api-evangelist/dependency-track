          description: Description of the notification publisher
        extensionName:
          type: string
          description: Name of the publisher extension that handles delivery
        name:
          type: string
          description: Name of the notification publisher
        template:
          type: string
          description: Template used to render the notification payload
        templateMimeType:
          type: string
          description: MIME type of the rendered template
        uuid:
