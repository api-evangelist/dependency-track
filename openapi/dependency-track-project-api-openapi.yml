  /v1/project/{uuid}:
    delete:
      description: Requires permission PORTFOLIO_MANAGEMENT or PORTFOLIO_MANAGEMENT_DELETE
      operationId: deleteProject
      parameters:
      - description: The UUID of the project to delete
        in: path
        name: uuid
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Project removed successfully
        '401':
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Access to the requested project is forbidden
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: The UUID of the project could not be found
        '500':
          description: Unable to delete components of the project
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Deletes a project
      tags:
      - Project
    get:
      description: Requires permission VIEW_PORTFOLIO
      operationId: getProject
      parameters:
      - description: The UUID of the project to retrieve
        in: path
        name: uuid
        required: true
