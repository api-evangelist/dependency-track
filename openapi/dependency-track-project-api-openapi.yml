          maxLength: 255
          minLength: 0
          pattern: ^[\p{Alnum}:/\\!@#$%^&{}\[\]()_+\-=,.~'` ]{1,255}$
        group:
          type: string
          maxLength: 255
          minLength: 0
          pattern: ^[\p{IsWhite_Space}\p{L}\p{M}\p{S}\p{N}\p{P}]*$
        isInternal:
          type: boolean
        lastInheritedRiskScore:
          type: number
          format: double
        license:
