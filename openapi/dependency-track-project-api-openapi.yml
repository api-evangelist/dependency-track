openapi: 3.2.0
info:
  contact:
    name: The Dependency-Track Authors
    url: https://github.com/DependencyTrack/dependency-track
  description: 'REST API of OWASP Dependency-Track


    > **Note:** This API version is in maintenance mode and will be

    > superseded by v2, available under `/api/v2`, which follows a

    > spec-first approach.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: OWASP Dependency-Track Project API
  version: 1.0.0
servers:
- url: /api
tags:
- name: Project
paths:
  /v1/project:
    get:
      description: Requires permission VIEW_PORTFOLIO
      operationId: getProjects
      parameters:
      - description: The page to return. To be used in conjunction with <code>pageSize</code>.
        in: query
        name: pageNumber
        schema:
          type: string
          default: '1'
      - description: Number of elements to return per page. To be used in conjunction with <code>pageNumber</code>.
        in: query
        name: pageSize
        schema:
          type: string
          default: '100'
      - description: Offset to start returning elements from. To be used in conjunction with <code>limit</code>.
        in: query
        name: offset
        schema:
          type: string
      - description: Number of elements to return per page. To be used in conjunction with <code>offset</code>.
        in: query
        name: limit
        schema:
          type: string
      - description: Name of the resource field to sort on.
        in: query
        name: sortName
        schema:
          type: string
      - description: Ordering of items when sorting with <code>sortName</code>.
        in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc, desc
      - description: The optional name of the project to query on
        in: query
        name: name
        schema:
          type: string
      - description: Optionally excludes inactive projects from being returned
        in: query
        name: excludeInactive
        schema:
          type: boolean
      - description: Optionally excludes children projects from being returned
        in: query
        name: onlyRoot
        schema:
          type: boolean
      - description: The UUID of the team which projects shall be excluded
        in: query
        name: notAssignedToTeamWithUuid
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListProjectsResponseItem'
          description: A list of all projects
          headers:
            X-Total-Count:
              description: The total number of projects
              schema:
                format: integer
              style: simple
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns a list of all projects
      tags:
      - Project
    post:
      description: 'To re-parent the project, set parent to an object containing

        the new parent''s uuid. Omit parent (or set it to

        null) to remove the parent. Providing parent

        without a non-null uuid is rejected with 400.


        Requires permission PORTFOLIO_MANAGEMENT or PORTFOLIO_MANAGEMENT_UPDATE'
      operationId: updateProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: The updated project
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Access to the project, the provided parent, or the previous latest project version, is forbidden
        '404':
          description: The UUID of the project could not be found
        '409':
          description: "<ul>\n  <li>An inactive Parent cannot be selected as parent, or</li>\n  <li>Project cannot be set to inactive if active children are present, or</li>\n  <li>A project with the specified name already exists, or</li>\n  <li>A project cannot select itself as a parent</li>\n</ul>"
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Updates a project
      tags:
      - Project
    put:
      description: 'To create the project under a parent, set parent to an object

        containing the parent''s uuid. To create a top-level project,

        omit parent or set it to null. Providing

        parent without a non-null uuid is rejected with 400.


        When portfolio access control is enabled, one or more teams to grant access

        to can be provided via accessTeams. Either uuid or

        name of a team must be specified. Only teams which the authenticated

        principal is a member of can be assigned. Principals with ACCESS_MANAGEMENT

        permission can assign any team.


        Requires permission PORTFOLIO_MANAGEMENT or PORTFOLIO_MANAGEMENT_CREATE'
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: The created project
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Access to the provided parent project, or previous latest project version, is forbidden
        '409':
          description: "<ul>\n  <li>An inactive Parent cannot be selected as parent, or</li>\n  <li>A project with the specified name already exists</li>\n</ul>"
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Creates a new project
      tags:
      - Project
  /v1/project/batchDelete:
    post:
      description: Requires permission PORTFOLIO_MANAGEMENT or PORTFOLIO_MANAGEMENT_DELETE
      operationId: deleteProjects
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: uuid
              maxItems: 1000
              minItems: 1
              uniqueItems: true
      responses:
        '204':
          description: Projects removed successfully
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Deletes a list of projects specified by their UUIDs
      tags:
      - Project
  /v1/project/classifier/{classifier}:
    get:
      description: Requires permission VIEW_PORTFOLIO
      operationId: getProjectsByClassifier
      parameters:
      - description: The page to return. To be used in conjunction with <code>pageSize</code>.
        in: query
        name: pageNumber
        schema:
          type: string
          default: '1'
      - description: Number of elements to return per page. To be used in conjunction with <code>pageNumber</code>.
        in: query
        name: pageSize
        schema:
          type: string
          default: '100'
      - description: Offset to start returning elements from. To be used in conjunction with <code>limit</code>.
        in: query
        name: offset
        schema:
          type: string
      - description: Number of elements to return per page. To be used in conjunction with <code>offset</code>.
        in: query
        name: limit
        schema:
          type: string
      - description: Name of the resource field to sort on.
        in: query
        name: sortName
        schema:
          type: string
      - description: Ordering of items when sorting with <code>sortName</code>.
        in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc, desc
      - description: The classifier to query on
        in: path
        name: classifier
        required: true
        schema:
          type: string
          enum:
          - APPLICATION
          - FRAMEWORK
          - LIBRARY
          - CONTAINER
          - OPERATING_SYSTEM
          - DEVICE
          - FIRMWARE
          - FILE
          - PLATFORM
          - DEVICE_DRIVER
          - MACHINE_LEARNING_MODEL
          - DATA
          - CRYPTOGRAPHIC_ASSET
      - description: Optionally excludes inactive projects from being returned
        in: query
        name: excludeInactive
        schema:
          type: boolean
      - description: Optionally excludes children projects from being returned
        in: query
        name: onlyRoot
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListProjectsResponseItem'
          description: A list of all projects by classifier
          headers:
            X-Total-Count:
              description: The total number of projects
              schema:
                format: integer
              style: simple
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns a list of all projects by classifier
      tags:
      - Project
  /v1/project/clone:
    put:
      deprecated: true
      description: 'Requires permission PORTFOLIO_MANAGEMENT or PORTFOLIO_MANAGEMENT_CREATE


        Deprecated! Use /api/v2/projects/{uuid}/clone instead.'
      operationId: cloneProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneProjectRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BomUploadResponse'
          description: Token to be used for checking cloning progress
        '401':
          description: Unauthorized
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Access to the requested project, or the previous latest project version, is forbidden
        '404':
          description: The UUID of the project could not be found
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Clones a project
      tags:
      - Project
  /v1/project/concise:
    get:
      description: Requires permission VIEW_PORTFOLIO
      operationId: getProjectsConcise
      parameters:
      - description: The page to return. To be used in conjunction with <code>pageSize</code>.
        in: query
        name: pageNumber
        schema:
          type: string
