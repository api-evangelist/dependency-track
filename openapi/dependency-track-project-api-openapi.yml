        sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        sha384:
          type: string
          pattern: ^[0-9a-fA-F]{96}$
        sha3_256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        sha3_384:
          type: string
          pattern: ^[0-9a-fA-F]{96}$
        sha3_512:
