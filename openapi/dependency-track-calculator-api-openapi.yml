openapi: 3.2.0
info:
  contact:
    name: The Dependency-Track Authors
    url: https://github.com/DependencyTrack/dependency-track
  description: 'REST API of OWASP Dependency-Track


    > **Note:** This API version is in maintenance mode and will be

    > superseded by v2, available under `/api/v2`, which follows a

    > spec-first approach.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: OWASP Dependency-Track Calculator API
  version: 1.0.0
servers:
- url: /api
tags:
- name: calculator
paths:
  /v1/calculator/cvss:
    get:
      operationId: getCvssScores
      parameters:
      - description: A valid CVSSv2, CVSSv3 or CVSSv4 vector
        in: query
        name: vector
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvssScoreResponse'
          description: The calculated scores
        '400':
          description: An invalid CVSS vector was submitted
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns the CVSS base score, impact sub-score and exploitability sub-score
      tags:
      - calculator
  /v1/calculator/owasp:
    get:
      operationId: getOwaspRRScores
      parameters:
      - description: A valid OWASP Risk Rating vector
        in: query
        name: vector
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Score'
          description: The calculated scores
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns the OWASP Risk Rating likelihood score, technical impact score and…
      tags:
      - calculator
components:
  schemas:
    Score:
      type: object
      properties:
        businessImpact:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        businessImpactScore:
          type: number
          format: double
        likelihood:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        likelihoodScore:
          type: number
          format: double
        technicalImpact:
          type: string
          enum:
          - HIGH
          - MEDIUM
          - LOW
        technicalImpactScore:
          type: number
          format: double
    CvssScoreResponse:
      type: object
      properties:
        baseScore:
          type: number
          format: double
        environmentalScore:
          type: number
          format: double
        exploitabilitySubScore:
          type: number
          format: double
        impactSubScore:
          type: number
          format: double
        modifiedImpactSubScore:
          type: number
          format: double
        temporalScore:
          type: number
          format: double
  securitySchemes:
    ApiKeyAuth:
      description: Authentication via API key.
      in: header
      name: X-Api-Key
      type: apiKey
    BearerAuth:
      bearerFormat: Opaque
      description: 'Authentication via opaque server-issued session token.

        Tokens are obtained from `POST /api/v1/user/login` or

        `POST /api/v1/user/oidc/login`.'
      scheme: bearer
      type: http
