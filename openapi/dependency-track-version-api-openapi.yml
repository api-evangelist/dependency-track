openapi: 3.2.0
info:
  contact:
    name: The Dependency-Track Authors
    url: https://github.com/DependencyTrack/dependency-track
  description: 'REST API of OWASP Dependency-Track


    > **Note:** This API version is in maintenance mode and will be

    > superseded by v2, available under `/api/v2`, which follows a

    > spec-first approach.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: OWASP Dependency-Track Version API
  version: 1.0.0
servers:
- url: /api
tags:
- name: Version
paths:
  /version:
    get:
      description: Returns a simple json object containing the name of the application and the version
      operationId: getVersion
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
          description: Application version information
      summary: Returns application version information
      tags:
      - Version
components:
  schemas:
    Framework:
      type: object
      properties:
        name:
          type: string
        timestamp:
          type: string
        uuid:
          type: string
        version:
          type: string
    About:
      type: object
      properties:
        application:
          type: string
        framework:
          $ref: '#/components/schemas/Framework'
        timestamp:
          type: string
        uuid:
          type: string
        version:
          type: string
  securitySchemes:
    ApiKeyAuth:
      description: Authentication via API key.
      in: header
      name: X-Api-Key
      type: apiKey
    BearerAuth:
      bearerFormat: Opaque
      description: 'Authentication via opaque server-issued session token.

        Tokens are obtained from `POST /api/v1/user/login` or

        `POST /api/v1/user/oidc/login`.'
      scheme: bearer
      type: http
