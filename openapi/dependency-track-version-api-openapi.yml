openapi: 3.2.0
info:
  title: Dependency Track Version API
  version: 1.0.0
  contact:
    name: The Dependency-Track Authors
    url: https://github.com/DependencyTrack/dependency-track
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'Operations tagged version across 2 of this provider''s published API definitions: dependency-track-openapi-v1.yaml, dependency-track-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
tags:
- name: Version
paths:
  /version:
    get:
      description: Returns a simple json object containing the name of the application and the version
      operationId: getVersion
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
          description: Application version information
      summary: Returns application version information
      tags:
      - Version
    servers:
    - url: /api
components:
  schemas:
    About:
      type: object
      properties:
        application:
          type: string
        framework:
          $ref: '#/components/schemas/Framework'
        timestamp:
          type: string
        uuid:
          type: string
        version:
          type: string
    Framework:
      type: object
      properties:
        name:
          type: string
        timestamp:
          type: string
        uuid:
          type: string
        version:
          type: string
  securitySchemes:
    ApiKeyAuth:
      description: Authentication via API key.
      in: header
      name: X-Api-Key
      type: apiKey
    BearerAuth:
      bearerFormat: Opaque
      description: 'Authentication via opaque server-issued session token.

        Tokens are obtained from `POST /api/v1/user/login` or

        `POST /api/v1/user/oidc/login`.'
      scheme: bearer
      type: http
x-refined-from:
- dependency-track-openapi-v1.yaml
- dependency-track-openapi.yml
