openapi: 3.2.0
info:
  title: Dependency Track Tag API
  version: 1.0.0
  contact:
    name: The Dependency-Track Authors
    url: https://github.com/DependencyTrack/dependency-track
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: 'Operations tagged tag across 2 of this provider''s published API definitions: dependency-track-openapi-v1.yaml, dependency-track-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
tags:
- name: Tag
paths:
  /v1/tag:
    delete:
      description: 'A tag can only be deleted if no projects or policies are assigned to it.


        Principals with PORTFOLIO_MANAGEMENT permission, and access

        to all assigned projects (if portfolio ACL is enabled), can delete

        a tag with assigned projects.


        Principals with POLICY_MANAGEMENT permission can delete tags

        with assigned policies.


        Requires permission TAG_MANAGEMENT or TAG_MANAGEMENT_DELETE'
      operationId: deleteTags
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              maxItems: 100
              minItems: 1
              uniqueItems: true
        description: Names of the tags to delete
      responses:
        '204':
          description: Tags deleted successfully.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TagOperationProblemDetails'
          description: Operation failed
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Deletes one or more tags
      tags:
      - Tag
    get:
      description: Requires permission VIEW_PORTFOLIO
      operationId: getAllTags
      parameters:
      - description: The page to return. To be used in conjunction with <code>pageSize</code>.
        in: query
        name: pageNumber
        schema:
          type: string
          default: '1'
      - description: Number of elements to return per page. To be used in conjunction with <code>pageNumber</code>.
        in: query
        name: pageSize
        schema:
          type: string
          default: '100'
      - description: Offset to start returning elements from. To be used in conjunction with <code>limit</code>.
        in: query
        name: offset
        schema:
          type: string
      - description: Number of elements to return per page. To be used in conjunction with <code>offset</code>.
        in: query
        name: limit
        schema:
          type: string
      - description: Name of the resource field to sort on.
        in: query
        name: sortName
        schema:
          type: string
      - description: Ordering of items when sorting with <code>sortName</code>.
        in: query
        name: sortOrder
        schema:
          type: string
          enum:
          - asc, desc
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagListResponseItem'
          description: A list of all tags
          headers:
            X-Total-Count:
              description: The total number of tags
              schema:
                format: integer
              style: simple
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns a list of all tags
      tags:
      - Tag
    put:
      description: Requires permission TAG_MANAGEMENT
      operationId: createTags
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              maxItems: 100
              minItems: 1
              uniqueItems: true
        description: Names of the tags to create
        required: true
      responses:
        '201':
          description: Tags created successfully.
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Creates one or more tags
      tags:
      - Tag
    servers:
    - url: /api
  /v1/tag/policy/{uuid}:
    get:
      description: Requires permission VIEW_PORTFOLIO
      operationId: getTagsForPolicy
      parameters:
      - description: The UUID of the policy
        in: path
