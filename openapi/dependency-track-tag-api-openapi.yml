components:
  schemas:
    TaggedPolicyListResponseItem:
      type: object
      properties:
        name:
          type: string
          description: Name of the policy
        uuid:
          type: string
          format: uuid
          description: UUID of the policy
      required:
      - name
      - uuid
    TaggedProjectListResponseItem:
      type: object
      properties:
        name:
          type: string
          description: Name of the project
        uuid:
          type: string
          format: uuid
          description: UUID of the project
        version:
          type: string
          description: Version of the project
      required:
      - name
      - uuid
    TagOperationProblemDetails:
      type: object
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        properties:
          errors:
            type: object
            additionalProperties:
              type: string
              description: Errors encountered during the operation, grouped by tag name
            description: Errors encountered during the operation, grouped by tag name
      required:
      - detail
      - status
      - title
    TaggedCollectionProjectListResponseItem:
      type: object
      properties:
        name:
          type: string
          description: Name of the collection project
        uuid:
          type: string
          format: uuid
          description: UUID of the collection project
        version:
          type: string
          description: Version of the collection project
      required:
      - name
      - uuid
    TagListResponseItem:
      type: object
      properties:
        collectionProjectCount:
          type: integer
          format: int64
          description: Number of collection projects assigned to this tag
        name:
          type: string
          description: Name of the tag
        notificationRuleCount:
          type: integer
          format: int64
          description: Number of notification rules assigned to this tag
        policyCount:
          type: integer
          format: int64
          description: Number of policies assigned to this tag
        projectCount:
          type: integer
          format: int64
          description: Number of projects assigned to this tag
        vulnerabilityCount:
          type: integer
          format: int64
          description: Number of vulnerabilities assigned to this tag
      required:
      - collectionProjectCount
      - name
      - notificationRuleCount
      - policyCount
      - projectCount
      - vulnerabilityCount
    TagResponse:
      type: object
      properties:
        name:
          type: string
          description: Name of the tag
      required:
      - name
    TaggedVulnerabilityListResponseItem:
      type: object
      properties:
        source:
          type: string
          description: Source of the vulnerability
        uuid:
          type: string
          format: uuid
          description: UUID of the vulnerability
        vulnId:
          type: string
          description: Vulnerability ID
      required:
      - source
      - uuid
      - vulnId
    ProblemDetails:
      type: object
      description: An RFC 9457 problem object
      properties:
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem
          example: Example detail
        instance:
          type: string
          format: uri
          description: Reference URI that identifies the specific occurrence of the problem
          example: https://api.example.org/foo/bar/example-instance
        status:
          type: integer
          format: int32
          description: HTTP status code generated by the origin server for this occurrence of the problem
          example: 400
        title:
          type: string
          description: Short, human-readable summary of the problem type
          example: Example title
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: https://api.example.org/foo/bar/example-problem
      required:
      - detail
      - status
      - title
  securitySchemes:
    ApiKeyAuth:
      description: Authentication via API key.
      in: header
      name: X-Api-Key
      type: apiKey
    BearerAuth:
      bearerFormat: Opaque
      description: 'Authentication via opaque server-issued session token.

        Tokens are obtained from `POST /api/v1/user/login` or

        `POST /api/v1/user/oidc/login`.'
      scheme: bearer
      type: http
