          description: A list of all tags associated with a given policy
          headers:
            X-Total-Count:
              description: The total number of tags
              schema:
                format: integer
              style: simple
        '401':
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Returns a list of all tags associated with a given policy
      tags:
      - Tag
    servers:
    - url: /api
